<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>听见你宣传海报</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 675px;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        display: grid;
        grid-template-columns: 490px 1fr;
        gap: 42px;
        padding: 54px;
        background:
          radial-gradient(circle at 8% 0%, rgba(246, 220, 121, 0.42), transparent 300px),
          #f2efe6;
        color: #18221d;
        font-family:
          "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei",
          sans-serif;
      }

      .copy {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
      }

      .tag {
        align-self: flex-start;
        padding: 7px 11px;
        border: 1px solid #146a52;
        border-radius: 999px;
        color: #146a52;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.09em;
      }

      h1 {
        margin: 46px 0 0;
        font-size: 91px;
        font-weight: 900;
        letter-spacing: -0.08em;
        line-height: 0.98;
      }

      h2 {
        margin: 17px 0 0;
        color: #ff6c4d;
        font-size: 45px;
        font-weight: 850;
        letter-spacing: -0.045em;
        line-height: 1.16;
      }

      .lead {
        margin: 24px 0 0;
        color: #58635c;
        font-size: 20px;
        line-height: 1.7;
      }

      .features {
        display: flex;
        gap: 8px;
        margin-top: 26px;
      }

      .features span {
        padding: 8px 11px;
        border-radius: 8px;
        background: #dff2e9;
        color: #0c4d3b;
        font-size: 14px;
        font-weight: 750;
      }

      .footer {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 14px;
        margin-top: auto;
        color: #58635c;
        font-size: 13px;
      }

      .footer strong {
        color: #18221d;
        font-size: 17px;
      }

      .screen {
        position: relative;
        align-self: center;
        width: 610px;
        height: 556px;
        overflow: hidden;
        border: 12px solid #18221d;
        border-radius: 30px;
        background: #18221d;
        box-shadow: 0 28px 60px rgba(24, 34, 29, 0.22);
        transform: rotate(1.5deg);
      }

      .screen img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 70% 28%;
      }

      .quote {
        position: absolute;
        right: 42px;
        bottom: 25px;
        z-index: 3;
        width: 295px;
        padding: 18px 20px;
        border-radius: 18px;
        background: #18221d;
        color: #fff;
        box-shadow: 0 18px 38px rgba(24, 34, 29, 0.24);
        transform: rotate(-3deg);
      }

      .quote small {
        display: block;
        color: #f6dc79;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.1em;
      }

      .quote p {
        margin: 8px 0 0;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.55;
      }

      .sound {
        position: absolute;
        top: 30px;
        right: 28px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 12px 15px;
        border-radius: 999px;
        background: #f6dc79;
      }

      .sound i {
        display: block;
        width: 3px;
        height: 12px;
        border-radius: 999px;
        background: #18221d;
      }

      .sound i:nth-child(2),
      .sound i:nth-child(6) {
        height: 24px;
      }

      .sound i:nth-child(3),
      .sound i:nth-child(5) {
        height: 34px;
      }

      .sound i:nth-child(4) {
        height: 43px;
      }
    </style>
  </head>
  <body>
    <section class="copy">
      <span class="tag">青空计划 · 公益赛道</span>
      <h1>听见你</h1>
      <h2>不用先被看见，<br />先被听见。</h2>
      <p class="lead">
        用四段真实声音认识一个人。透明匹配、无障碍活动与安全见面，
        让现实连接真正发生。
      </p>
      <div class="features">
        <span>本人录音</span>
        <span>无照片排名</span>
        <span>安全副驾驶</span>
      </div>
      <div class="footer">
        <span><strong>声音优先的无障碍交友</strong><br />Web 原型已上线</span>
        <span>esp-jsy.github.io/tingjianni-hear-you</span>
      </div>
    </section>
    <section class="screen">
      <img src="./screenshots/home-desktop.png" alt="听见你网页界面" />
      <div class="sound" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </section>
    <aside class="quote">
      <small>HEAR YOU</small>
      <p>“不是让你认识更多人，而是帮你成功地认识一个人。”</p>
    </aside>
  </body>
</html>
